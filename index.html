<!DOCTYPE html>

    <meta charset="UTF-8" />

    <meta name="theme-color" content="#16a34a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-title" content="Snap & Shop" />
    <link rel="manifest" href="/manifest.json" />
    <title>Snap & Shop</title>
    <script>
      // Stub for the Capacitor 7 cold-start race: the native shell can fire
      // a lifecycle event before @capacitor/core finishes loading. The real
      // runtime replaces these as soon as the bundle evaluates.
      window.Capacitor = window.Capacitor || {};
      window.Capacitor.triggerEvent = window.Capacitor.triggerEvent || function () {};
    </script>

  </body>
